<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="theme-color" content="#0f766e">
<script>window.FP_SITE = true;</script>
<script src="config.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Family Planner</title>
<style>
:root{--bg:#f4f2ec;--card:#fff;--ink:#1c2430;--muted:#6b7280;--line:#e4e0d6;--soft:#efece4;--accent:#0f766e;--good:#16a34a;--warn:#d97706;--bad:#dc2626;--now:#ef4444;--shadow:0 1px 2px rgba(0,0,0,.05);--kid:#0f766e;color-scheme:light}
:root[data-theme=dark]{--bg:#121519;--card:#1b2027;--ink:#e7e9ec;--muted:#98a2ad;--line:#2b323b;--soft:#232931;--accent:#2dd4bf;--shadow:none;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC",sans-serif;overflow-x:clip}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:1100px;margin:0 auto;padding:8px 14px 90px}
.top{display:flex;align-items:center;gap:8px;padding:6px 2px 8px}
.brand{font-weight:800;font-size:20px;flex:1;display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:transparent;border-radius:12px;min-width:44px;min-height:40px;font-size:20px;display:grid;place-items:center}
.iconbtn:hover{background:var(--soft)}
.iconbtn[hidden],[hidden]{display:none!important}
.sync{border:0;background:transparent;color:var(--muted);font-size:13px;display:flex;gap:6px;align-items:center;padding:6px 8px;border-radius:999px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.sync.busy i{background:var(--warn)}.sync.err i{background:var(--bad)}.sync.err{color:var(--bad)}
.banner{background:#e0e7ff;color:#3730a3;border-radius:12px;padding:9px 12px;font-size:14px;margin-bottom:8px}
:root[data-theme=dark] .banner{background:#272b52;color:#c7d2fe}
.people{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px 4px 4px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:7px;white-space:nowrap;flex:none}
.chip .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--soft)}
.chip.on{color:#fff}.chip.on .av{background:rgba(255,255,255,.22)}
.av{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;flex:none;background:var(--soft)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.chip .pen{font-size:11px;margin-left:-2px;opacity:.9}
.emgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:6px}
.emb{font-size:26px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.emb.on{outline:3px solid #0f766e}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:14px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1 0 auto;border:0;background:transparent;padding:9px 12px;border-radius:10px;font-weight:800;color:var(--muted);font-size:14px;white-space:nowrap}
.tab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 0 0 1px var(--line);margin-bottom:12px}
h2{font-size:17px;margin:18px 4px 8px}
h3{margin:0 0 8px;font-size:16px}
.muted{color:var(--muted)}.small{font-size:13px}.b{font-weight:800}
.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:15px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap;background:var(--soft);color:var(--ink)}
.btn.pri{background:var(--kid);color:#fff}.btn.go{background:var(--good);color:#fff}.btn.bad{background:rgba(220,38,38,.12);color:var(--bad)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{padding:6px 11px;min-height:36px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.btn.full{width:100%}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.nav .lbl{flex:1;text-align:center;font-weight:800}
.nav .lbl small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;background:var(--soft);white-space:nowrap}
.strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stat{background:var(--soft);border-radius:12px;padding:6px 10px;font-weight:800;font-size:15px;white-space:nowrap}
/* now card */
.now{border-radius:18px;padding:14px;margin-bottom:12px;color:#fff;background:var(--kid);position:relative;overflow:hidden}
.now .t{font-size:22px;font-weight:800;line-height:1.15}
.now .s{opacity:.9;margin-top:2px}
.now .clock{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:6px}
.now .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.now .btn{background:rgba(255,255,255,.2);color:#fff}
.now .btn.w{background:#fff;color:var(--kid)}
.now.over{background:linear-gradient(135deg,#b91c1c,#ea580c)}
.now.due{box-shadow:0 0 0 4px #f59e0b inset}
.now .clock.late{color:#fde68a}
.now.ring{animation:ring .5s ease-in-out 6}
@keyframes ring{0%,100%{transform:none}25%{transform:rotate(-1.2deg) scale(1.01)}75%{transform:rotate(1.2deg) scale(1.01)}}
.alarmset{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.alarmset .btn{min-height:34px;padding:4px 10px}
.mini{font-variant-numeric:tabular-nums;font-weight:800;margin-left:4px}
/* timetable */
.tt{display:grid;position:relative}
.tt .head{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;padding:4px 0}
.tt .hcell{text-align:center;font-size:12px;font-weight:800;color:var(--muted);padding:2px}
.tt .hk{font-size:14px;color:var(--ink)}
.tt .body{display:grid;position:relative}
.axis{position:relative}
.axis span{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-7px);font-variant-numeric:tabular-nums}
.lane{position:relative;border-left:1px solid var(--line)}
.lane.kidgap{border-left:2px solid var(--muted)}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);pointer-events:none}
.hl.half{border-top-style:dashed;opacity:.5}
.blk{position:absolute;left:2px;right:2px;border-radius:8px;padding:2px 5px;font-size:12px;line-height:1.2;overflow:hidden;border:0;text-align:left;display:block;width:auto}
.blk .n{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.blk .m{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-size:11px}
.blk.plan{background:var(--card);box-shadow:inset 0 0 0 2px var(--nc);color:var(--ink)}
.blk.plan.living{box-shadow:inset 0 0 0 1px var(--nc);opacity:.75}
.blk.plan.missed{box-shadow:inset 0 0 0 2px var(--bad);background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(220,38,38,.08) 6px 12px)}
.blk.plan.cancelled{opacity:.45;text-decoration:line-through}
.blk.plan.ok::after{content:"✓";position:absolute;right:4px;top:1px;font-weight:900;color:var(--good)}
.blk.plan.chg::after{content:"↺";position:absolute;right:4px;top:1px;font-weight:900;color:var(--warn)}
.blk.done{background:var(--nc);color:#fff}
.blk.done.auto{opacity:.55}
.blk.run{background:repeating-linear-gradient(135deg,var(--nc) 0 10px,rgba(255,255,255,.25) 10px 20px);color:#fff;box-shadow:0 0 0 2px var(--ink)}
.blk .ovr{position:absolute;left:0;right:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(234,88,12,.95) 0 6px,rgba(251,191,36,.95) 6px 12px)}
.nowline{position:absolute;left:0;right:0;border-top:2px solid var(--now);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.wk .blk{left:1px;right:1px;padding:1px 3px;font-size:11px;border-radius:5px}
.blk.ro{cursor:default}
.rcard{box-shadow:none;border:1px solid var(--line);margin-top:12px}
.lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.rpm{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-top:10px}
.rpp{display:flex;align-items:flex-end;gap:5px;height:110px;border-bottom:1px solid var(--line);padding:0 2px}
.rpc{flex:1;position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center;border:0;background:none;padding:0;cursor:pointer;min-width:0}
.rpb{position:absolute;bottom:0;left:0;right:0;border-radius:4px 4px 0 0}
.rpd{position:relative;display:block;width:56%;border-radius:4px 4px 0 0}
.rpl{display:flex;gap:5px;padding:4px 2px 0;font-size:11px;color:var(--muted)}.rpl span{flex:1;text-align:center}
.rpt{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 96px;gap:10px;align-items:center;padding:3px 0;width:100%;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.rpt .tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.rpt .tk{position:relative;height:12px}
.rpt .tk i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0}
.rpt .tk i.td{top:3px;bottom:3px}
.rpt .tv{text-align:right;font-variant-numeric:tabular-nums}
.evp{display:inline-block;flex:none;min-width:98px;text-align:center;color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;margin-right:6px;font-variant-numeric:tabular-nums}
.rshort{color:#d97706}.rover{color:var(--bad)}
@media (max-width:560px){.rpt{grid-template-columns:minmax(0,1fr) 92px;row-gap:3px}.rpt .tk{grid-column:1/-1;grid-row:2}}
.rtw{overflow-x:auto;margin-top:8px}
.rtbl{width:100%;min-width:600px;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.rtbl th,.rtbl td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.rtbl th{font-weight:600;color:var(--muted);font-size:12px}
.rtbl .n{text-align:left;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.rtbl tr.g td{font-weight:700;background:var(--soft)}
.rtbl tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.rtbl .wk{border-left:1px solid var(--line)}
.rtbl .pl{color:var(--muted);font-size:11px}
.blk.liv{background:var(--soft)!important;box-shadow:none!important;color:var(--muted)!important;opacity:1;border-radius:6px;padding:0 6px;font-size:11px;display:flex;align-items:center}
.blk.liv .n{font-weight:600}
.blk.liv.ok::after,.blk.liv.chg::after{content:none}
/* lists & tables */
.list .it{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-size:12px;font-weight:800;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--soft)}
.scroll{overflow-x:auto}
.bars .r{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:8px;align-items:center;padding:5px 0;font-size:14px}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.bar i.p{opacity:.3}
.ring{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring span{width:56px;height:56px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800}
.tgt{border-radius:16px;padding:12px;box-shadow:0 0 0 1px var(--line);background:var(--card);margin-bottom:10px}
.cnt{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
/* forms & sheets */
label.f{display:block;font-weight:800;font-size:13px;margin:10px 0 5px;color:var(--muted)}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=date],input[type=time],input[type=url],select,textarea{font-size:16px;width:100%;padding:10px 11px;border-radius:12px;border:2px solid var(--line);background:var(--card);min-height:44px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(15,118,110,.25)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-weight:800;min-height:42px}
.opt.on{border-color:var(--kid);background:var(--kid);color:#fff}
.sheet-wrap{position:fixed;inset:0;background:rgba(10,15,25,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet-wrap[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:22px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}}
.stitle{font-size:21px;font-weight:800;line-height:1.2}
.sbtns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.sbtns .btn{flex:1}
.acts{display:grid;gap:8px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:11px 16px;border-radius:14px;font-weight:700;z-index:70;max-width:92vw;text-align:center}
.toast[hidden]{display:none}
.err{background:rgba(220,38,38,.1);color:var(--bad);border-radius:12px;padding:10px 12px;font-weight:700;margin-top:8px}
.center{text-align:center}
.big{font-size:48px}
.savebar{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);z-index:6}
.editrow{display:grid;grid-template-columns:56px minmax(0,1.6fr) minmax(0,1fr) 44px;gap:6px;align-items:center;margin-bottom:6px}
.editrow input,.editrow select{padding:8px;min-height:40px}
.tplrow{display:grid;grid-template-columns:128px 128px minmax(0,1fr) 40px;gap:6px;align-items:center;margin-bottom:6px}
.tplrow input,.tplrow select{padding:7px;min-height:40px}
@media (max-width:600px){
  .bars .r{grid-template-columns:96px minmax(0,1fr) 104px;font-size:13px}
  .editrow{grid-template-columns:48px minmax(0,1fr) 44px}.editrow .lnk{grid-column:1/-1}
  .tplrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;padding-bottom:6px;border-bottom:1px solid var(--line)}.tplrow select{grid-column:1/3;grid-row:2}
  .tbl .hide-s{display:none}
  .brand{font-size:18px}
}
@media print{.top,.people,.tabs,.banner,.noprint,.savebar{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span>🗓️</span><span id="famName">Family Planner</span></div>
    <button id="syncBtn" class="sync busy"><i></i><span id="syncText">…</span></button>
    <button id="bellBtn" class="iconbtn" aria-label="History" hidden style="position:relative">🔔<span id="bellN" style="position:absolute;top:2px;right:2px;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;font-weight:800;padding:0 5px;line-height:16px" hidden></span></button>
    <button id="devBtn" class="iconbtn" aria-label="Device settings">⚙️</button>
  </header>
  <div id="banner" class="banner" hidden></div>
  <nav id="people" class="people"></nav>
  <nav id="tabs" class="tabs"></nav>
  <main id="view"><div class="card center muted">Loading…</div></main>
</div>
<div id="sheetWrap" class="sheet-wrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>
<script>
/* ===== Family Planner v2 – shared engine (runs in the app, the preview and Google Apps Script) ===== */
var FP = (function () {
  'use strict';
  var NATURES = ['Academic', 'Development', 'Living', 'Toxic'];
  var NATURE_COLOR = { Academic: '#2563eb', Development: '#16a34a', Living: '#94a3b8', Toxic: '#dc2626' };
  var TICKET_MIN = 15;     // 1 ticket = 15 minutes of Toxic time
  var YELLOW_MIN = 3;      // overrun ≥ 3 min → yellow card
  var RED_MIN = 15;        // every full 15 min overrun → 1 red card
  var AUTO_FINISH_MIN = 30;
  var DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var REPORT_NATURES = ['Academic', 'Development', 'Toxic']; // Living is left out of reports
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  /* ---------- sheet layouts (column key, header) ---------- */
  var COLS = {
    tasks: [['name', 'Task'], ['nature', 'Nature'], ['emoji', 'Emoji'], ['link', 'Link'], ['active', 'Active']],
    plan: [['ref', 'Entry Ref'], ['type', 'Planning/Workdone'], ['kid', 'Kids'], ['date', 'Date'], ['from', 'Time_Fr'], ['to', 'Time_To'], ['task', 'Task'], ['by', 'Created by'], ['note', 'Note'], ['made', 'Created at']],
    done: [['ref', 'Entry Ref'], ['type', 'Planning/Workdone'], ['kid', 'Kids'], ['date', 'Date'], ['from', 'Time_Fr'], ['to', 'Time_To'], ['task', 'Task'], ['by', 'Created by'], ['planRef', 'Plan Ref'], ['status', 'Status'], ['result', 'Result'], ['min', 'Minutes'], ['tickets', 'Tickets used'], ['overrun', 'Overrun (min)'], ['card', 'Card'], ['note', 'Note'], ['made', 'Created at']],
    template: [['kid', 'Kids'], ['day', 'Day'], ['from', 'Time_Fr'], ['to', 'Time_To'], ['task', 'Task']],
    tickets: [['ref', 'Entry Ref'], ['kid', 'Kids'], ['date', 'Date'], ['time', 'Time'], ['change', 'Change'], ['kind', 'Kind'], ['reason', 'Reason'], ['relRef', 'Related Ref'], ['by', 'Created by']],
    cards: [['ref', 'Entry Ref'], ['kid', 'Kids'], ['date', 'Date'], ['color', 'Card'], ['count', 'Count'], ['overrun', 'Overrun (min)'], ['relRef', 'Related Ref'], ['status', 'Status'], ['applied', 'Applied on'], ['reason', 'Reason'], ['by', 'Created by']],
    messages: [['time', 'Time'], ['type', 'Type'], ['text', 'Message'], ['refs', 'Related Refs'], ['by', 'By'], ['undo', 'Undo data'], ['state', 'State'], ['id', 'ID']],
    targets: [['id', 'ID'], ['kid', 'Kids'], ['term', 'Term'], ['title', 'Target'], ['due', 'Due date'], ['kind', 'Kind'], ['goal', 'Goal'], ['progress', 'Progress'], ['task', 'Task'], ['since', 'Since'], ['done', 'Achieved'], ['note', 'Note'], ['by', 'Created by']]
  };
  var SHEET_NAMES = { tasks: 'Tasks', plan: 'Planning', done: 'Workdone', template: 'Template', tickets: 'Tickets', cards: 'Cards', targets: 'Targets', messages: 'Messages' };
  var NUM_KEYS = { min: 1, tickets: 1, overrun: 1, change: 1, count: 1, goal: 1, progress: 1 };
  var DATE_KEYS = { date: 1, due: 1, since: 1, applied: 1 };
  var TIME_KEYS = { from: 1, to: 1, time: 1 };

  /* ---------- dates & times ---------- */
  function pad(n, w) { n = String(n); while (n.length < (w || 2)) n = '0' + n; return n; }
  function isDate(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function isTime(s) { return typeof s === 'string' && /^\d{2}:\d{2}$/.test(s); }

      if (nowA >= due + AUTO_FINISH_MIN) {
        var poison = natureOf(db, w.task) === 'Toxic';
        finishRow(db, w, poison ? due + AUTO_FINISH_MIN : due, ctx, 'Auto-finished', now);
        msg(db, now, 'Auto-finish', w.kid + ' did not press Finish: ' + w.task + ' (started ' + w.from + ') was finished automatically at ' + w.to + (w.card ? ' – ' + w.card + ' card' : ''), [w.ref]);
      }
    });
    var since = addDays(now.date, -14);
    var linked = {};
    db.done.forEach(function (w) { if (w.planRef) linked[w.planRef] = true; });
    db.plan.forEach(function (p) {
      if (p.date < since || p.date > now.date) return;
      var n = natureOf(db, p.task);
      // 2) Living tasks count as done once their time has passed
      if (n === 'Living' && !linked[p.ref] && abs(p.date, p.from) + span(p.from, p.to) <= nowA) {
        // fill only the time not already covered by real entries
        var ps = abs(p.date, p.from), pe = ps + span(p.from, p.to);
        var busy = db.done.filter(function (x) { return x.kid === p.kid && x.by !== 'Auto' && x.from && x.status !== 'Cancelled'; })
          .map(function (x) { var s0 = abs(x.date, x.from); return [s0, x.status === 'Running' ? nowA : s0 + span(x.from, x.to)]; })
          .filter(function (b) { return b[0] < pe && ps < b[1]; }).sort(function (a, b) { return a[0] - b[0]; });
        var gaps = [], cur = ps;
        busy.forEach(function (b) { if (b[0] > cur) gaps.push([cur, Math.min(b[0], pe)]); cur = Math.max(cur, b[1]); });
        if (cur < pe) gaps.push([cur, pe]);
        var base = { type: 'Workdone', kid: p.kid, date: p.date, task: p.task, by: 'Auto', planRef: p.ref, result: '', min: 0, tickets: 0, overrun: 0, card: '', made: stamp(now) };
        if (!gaps.length) ins(db, 'done', Object.assign({ ref: nextRef(db), from: '', to: '', status: 'Cancelled', note: 'Covered by other activities' }, base, { result: 'Cancelled' }));
        var first = '';
        gaps.forEach(function (g) {
          var w = ins(db, 'done', Object.assign({ ref: nextRef(db), from: fromMin(g[0]), to: fromMin(g[1]), status: 'Done', note: first ? 'Split from ' + first : 'Auto (Living)' }, base));
          if (!first) first = w.ref;
          applyResult(db, w, ctx);
        });
        linked[p.ref] = true;
      }
      // 3) Toxic slot tickets once the Academic/Development tasks before it are done
      if (n === 'Toxic' && !isAdult(db, p.kid)) {
        var st = slotState(db, p, now);
        if (st.state === 'ready') ins(db, 'tickets', { ref: nextRef(db), kid: p.kid, date: now.date, time: now.time, change: st.n, kind: 'Earned', reason: 'Planned ' + p.task + ' ' + p.from + '–' + p.to + ' (' + uk(p.date) + ')', relRef: p.ref, by: 'Auto' });
      }
    });
  }

  /* ---------- actions ---------- */
  function needKid(db, name) { if (!kidOf(db, name)) throw err('Unknown child: ' + name); }
  function needTask(db, name) { if (!db.tasks.some(function (t) { return t.name === name; })) throw err('Unknown task: ' + name); }
  function needTime(t, label) { if (!isTime(t)) throw err((label || 'Time') + ' must look like 16:30'); }
  function canEditDay(ctx, date, now) { return ctx.role === 'parent' || (date >= addDays(now.date, -1) && date <= now.date); }

  var ACTIONS = {
    /* ----- children (and parents) ----- */
    start: function (db, p, ctx, now) {
      needKid(db, p.kid); needTask(db, p.task);
      var at = p.at || now.time; needTime(at);
      var date = (ctx.role === 'parent' && isDate(p.date)) ? p.date : now.date;
      if (abs(date, at) > abs(now.date, now.time) + 1) throw err('Start time is in the future');
      var plan = p.planRef ? byRef(db.plan, p.planRef) : null;
      if (p.planRef && !plan) throw err('That plan no longer exists');
      if (plan && plan.kid !== p.kid) throw err('That plan belongs to ' + plan.kid);
      if (plan && doneFor(db, plan.ref).some(function (w) { return w.status !== 'Cancelled'; })) throw err('That plan has already been started');
      var run = running(db, p.kid)[0];
      if (run) {
        if (!p.finishRunning) throw err('RUNNING:' + run.task);
        finishRow(db, run, Math.max(abs(run.date, run.from), abs(date, at)), ctx, '', now);
      }
      if (plan && plan.task !== p.task && natureOf(db, plan.task) === 'Living') plan = null; // doing something else during School/Free etc. is simply unplanned
      var nature = natureOf(db, p.task), n = 0;
      var ref = nextRef(db);
      if (nature === 'Toxic' && !isAdult(db, p.kid)) {
        n = Math.max(1, Math.round(+p.tickets || 1));
        if (balance(db, p.kid) < n) throw err('NO_TICKETS');
        ins(db, 'tickets', { ref: nextRef(db), kid: p.kid, date: now.date, time: now.time, change: -n, kind: 'Used', reason: p.task + ' (' + n * TICKET_MIN + ' min)', relRef: ref, by: ctx.name });
      }
      var w = ins(db, 'done', { ref: ref, type: 'Workdone', kid: p.kid, date: date, from: at, to: '', task: p.task, by: ctx.name, planRef: plan ? plan.ref : '', status: 'Running', result: 'Running', min: 0, tickets: n, overrun: 0, card: '', note: String(p.note || '').slice(0, 300), made: stamp(now) });
      return { ref: w.ref };
    },
    finish: function (db, p, ctx, now) {
      var w = byRef(db.done, p.ref);
      if (!w || w.status !== 'Running') throw err('This session is not running');
      var endA = abs(now.date, now.time);
      if (p.at) { needTime(p.at); endA = abs(w.date, p.at); if (endA < abs(w.date, w.from)) endA += 1440; if (endA > abs(now.date, now.time) + 1) throw err('Finish time is in the future'); }
      if (p.note) w.note = String(p.note).slice(0, 300);
      var ch = finishRow(db, w, endA, ctx, '', now);
      return { ref: w.ref, card: w.card, changed: ch.length };
    },
    extend: function (db, p, ctx, now) {
      var w = byRef(db.done, p.ref);
      if (!w || w.status !== 'Running' || natureOf(db, w.task) !== 'Toxic') throw err('Only a running Toxic session can be extended');
      if (isAdult(db, w.kid)) throw err('Grown-ups do not use tickets');
      var n = Math.max(1, Math.round(+p.tickets || 1));
      if (balance(db, w.kid) < n) throw err('NO_TICKETS');
      ins(db, 'tickets', { ref: nextRef(db), kid: w.kid, date: now.date, time: now.time, change: -n, kind: 'Used', reason: 'Extra time for ' + w.task, relRef: w.ref, by: ctx.name });
      w.tickets = (+w.tickets || 0) + n; upd(db, 'done', w);
      return { tickets: w.tickets };
    },
    change: function (db, p, ctx, now) {
      var w = byRef(db.done, p.ref);
      if (!w) throw err('Entry not found');
      needTask(db, p.task);
      if (ctx.role !== 'parent') {
        if (!canEditDay(ctx, w.date, now)) throw err('Ask a parent to change older days');
        if (natureOf(db, w.task) === 'Toxic' || natureOf(db, p.task) === 'Toxic') throw err('Toxic sessions can only be changed by a parent');
      }
      w.task = p.task; applyResult(db, w, ctx); upd(db, 'done', w);
      return { ref: w.ref };
    },
    cancel: function (db, p, ctx, now) {
      if (p.ref) {
        var w = byRef(db.done, p.ref);
        if (!w) throw err('Entry not found');
        if (w.status === 'Running') {
          if (natureOf(db, w.task) === 'Toxic') {
            var el = abs(now.date, now.time) - abs(w.date, w.from);
            if (el > 5 && ctx.role !== 'parent') throw err('Too late to cancel – press Finish');
            if (+w.tickets) ins(db, 'tickets', { ref: nextRef(db), kid: w.kid, date: now.date, time: now.time, change: +w.tickets, kind: 'Refund', reason: 'Cancelled ' + w.task, relRef: w.ref, by: ctx.name });
          }
          rem(db, 'done', w);
          return { removed: w.ref };
        }
        throw err('Use Delete for finished entries');
      }
      var plan = byRef(db.plan, p.planRef);
      if (!plan) throw err('Plan not found');
      if (ctx.role !== 'parent') {
        if (natureOf(db, plan.task) === 'Living') throw err('Only a parent can cancel this');
        if (plan.date !== now.date) throw err('You can only cancel today’s tasks');
      }
      if (doneFor(db, plan.ref).length) throw err('This task already has an entry');
      var c = ins(db, 'done', { ref: nextRef(db), type: 'Workdone', kid: plan.kid, date: plan.date, from: '', to: '', task: plan.task, by: ctx.name, planRef: plan.ref, status: 'Cancelled', result: 'Cancelled', min: 0, tickets: 0, overrun: 0, card: '', note: String(p.reason || '').slice(0, 300), made: stamp(now) });
      return { ref: c.ref };
    },
    addDone: function (db, p, ctx, now) {
      needKid(db, p.kid); needTask(db, p.task); needTime(p.from, 'From'); needTime(p.to, 'To');
      var date = isDate(p.date) ? p.date : now.date;
      if (!canEditDay(ctx, date, now)) throw err('Ask a parent to add older days');
      var poison = natureOf(db, p.task) === 'Toxic';
      if (poison && ctx.role !== 'parent') throw err('Use Start for Toxic tasks (it needs tickets)');
      if (abs(date, p.from) + span(p.from, p.to) > abs(now.date, now.time) + 1) throw err('That time hasn’t happened yet');
      var plan = p.planRef ? byRef(db.plan, p.planRef) : null;
      if (plan && plan.task !== p.task && natureOf(db, plan.task) === 'Living') plan = null;
      slotCheck(db, 'done', { kid: p.kid, date: date, from: p.from, to: p.to }, ctx, now, null);
      var ref = nextRef(db), n = poison ? Math.max(0, Math.round(+p.tickets || 0)) : 0;
      if (n) ins(db, 'tickets', { ref: nextRef(db), kid: p.kid, date: now.date, time: now.time, change: -n, kind: 'Used', reason: p.task + ' (added by parent)', relRef: ref, by: ctx.name });
      var w = ins(db, 'done', { ref: ref, type: 'Workdone', kid: p.kid, date: date, from: p.from, to: p.to, task: p.task, by: ctx.name, planRef: plan ? plan.ref : '', status: 'Done', result: '', min: 0, tickets: n, overrun: 0, card: '', note: String(p.note || '').slice(0, 300), made: stamp(now) });
      applyResult(db, w, ctx);
      var ch = takeSlot(db, 'done', w, ctx, now);
      return { ref: w.ref, changed: ch.length };
    },
    editDone: function (db, p, ctx, now) {
      var w = byRef(db.done, p.ref);
      if (!w) throw err('Entry not found');
      var poison = natureOf(db, w.task) === 'Toxic';
      if (ctx.role !== 'parent') {
        if (!canEditDay(ctx, w.date, now) || poison) throw err('Ask a parent to change this');
      }
      var before = w.task + ' ' + w.from + '–' + (w.to || '…'), doneBefore = snap(w);
      if (w.status === 'Done') slotCheck(db, 'done', { kid: w.kid, date: ctx.role === 'parent' && isDate(p.date) ? p.date : w.date, from: p.from || w.from, to: p.to || w.to }, ctx, now, w);
      if (p.task) { needTask(db, p.task); if (ctx.role !== 'parent' && natureOf(db, p.task) === 'Toxic') throw err('Ask a parent'); w.task = p.task; }
      if (p.from) { needTime(p.from, 'From'); w.from = p.from; }
      if (p.to && w.status !== 'Running') { needTime(p.to, 'To'); w.to = p.to; }
      if (ctx.role === 'parent' && isDate(p.date)) w.date = p.date;
      if (ctx.role === 'parent' && p.tickets != null && w.status !== 'Running') w.tickets = Math.max(0, Math.round(+p.tickets));
      if (p.note != null) w.note = String(p.note).slice(0, 300);
      if (w.status !== 'Running') applyResult(db, w, ctx);
      upd(db, 'done', w);
      var after = w.task + ' ' + w.from + '–' + (w.to || '…');
      if (after !== before) msg(db, now, 'Edit', ctx.name + ' changed Workdone ' + w.ref + ' (' + w.kid + ', ' + uk(w.date) + '): ' + before + ' → ' + after, [w.ref], ctx.name);
      var ch = w.status === 'Done' && after !== before ? takeSlot(db, 'done', w, ctx, now, false, doneBefore) : [];
      return { ref: w.ref, changed: ch.length };
    },
    delDone: function (db, p, ctx, now) {
      var w = byRef(db.done, p.ref);
      if (!w) return {};
      if (ctx.role !== 'parent' && (w.by !== ctx.name || !canEditDay(ctx, w.date, now) || natureOf(db, w.task) === 'Toxic')) throw err('Ask a parent to delete this');
      if (natureOf(db, w.task) === 'Toxic' && p.refund !== false) {
        var used = db.tickets.filter(function (t) { return t.relRef === w.ref; }).reduce(function (s, t) { return s + (+t.change || 0); }, 0);
        if (used < 0) ins(db, 'tickets', { ref: nextRef(db), kid: w.kid, date: now.date, time: now.time, change: -used, kind: 'Refund', reason: 'Entry ' + w.ref + ' deleted', relRef: w.ref, by: ctx.name });
      }
      db.cards.filter(function (c) { return c.relRef === w.ref && c.status === 'Active'; }).forEach(function (c) { rem(db, 'cards', c); });
      rem(db, 'done', w);
      msg(db, now, 'Delete', ctx.name + ' deleted Workdone ' + w.ref + ' (' + w.kid + ', ' + uk(w.date) + ' ' + w.task + ' ' + (w.from || '') + '–' + (w.to || '') + ')', [w.ref], ctx.name);
      return {};
    },
    targetInc: function (db, p, ctx, now) {
      var t = db.targets.filter(function (x) { return x.id === p.id; })[0];
      if (!t || t.kind !== 'Count') throw err('Target not found');
      var was = +t.progress || 0;
      t.progress = Math.max(0, was + (+p.delta || 0)); upd(db, 'targets', t);
      if (t.goal && was < t.goal && t.progress >= t.goal) msg(db, now, 'Target', '🎉 ' + t.kid + ' reached the target "' + t.title + '" (' + t.progress + '/' + t.goal + ')', [t.id], ctx.name);
      return {};
    },
    // a child changes own icon / photo (parents can change anyone's)
    avatar: function (db, p, ctx, now) {
      var k = (db.settings.kids || []).filter(function (x) { return x.name === p.kid; })[0];
      if (!k) throw err('Unknown child');
      if (ctx.role !== 'parent' && ctx.name !== k.name) throw err('You can only change your own picture');
      var what;
      if (p.clear) { k.photo = ''; what = 'removed the photo'; }
      else if (p.photo != null) {
        var ph = String(p.photo);
        if (!/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(ph) || ph.length > 8600) throw err('That photo could not be used – try another one');
        k.photo = ph; what = 'uploaded a new photo';
      } else {
        var e = String(p.emoji || '').trim();
        if (!e || e.length > 8) throw err('Pick an icon');
        k.emoji = e; what = 'changed the icon to ' + e;
      }
      db._settingsChanged = true;
      db._avatar = { kid: k.name, photo: k.photo || '' , photoChanged: p.clear || p.photo != null };
      msg(db, now, 'Profile', (ctx.name === k.name ? k.name : ctx.name + ' (for ' + k.name + ')') + ' ' + what, '', ctx.name);
      return { kid: k.name, emoji: k.emoji, photo: !!k.photo };
    },
    redeem: function (db, p, ctx, now) {
      needKid(db, p.kid);
      if (isAdult(db, p.kid)) throw err('Grown-ups do not use tickets');
      var r = (db.settings.rewards || []).filter(function (x) { return x.id === p.id && x.active !== 'No'; })[0];
      if (!r) throw err('That reward is not available');
      if (balance(db, p.kid) < r.cost) throw err('NO_TICKETS');
      var t = ins(db, 'tickets', { ref: nextRef(db), kid: p.kid, date: now.date, time: now.time, change: -r.cost, kind: 'Reward', reason: r.emoji + ' ' + r.name, relRef: r.id, by: ctx.name });
      msg(db, now, 'Reward', p.kid + ' redeemed ' + r.emoji + ' ' + r.name + ' for ' + r.cost + ' 🎟 – please give it', [t.ref], ctx.name, { kind: 'reward', kid: p.kid, cost: r.cost, name: r.emoji + ' ' + r.name, ticketRef: t.ref });
      return { ref: t.ref };
    },
    addTarget: function (db, p, ctx, now) {
      var t = p.target || {};
      if (ctx.role !== 'parent') t.kid = ctx.name;
      t.id = ''; t.done = 'No';
      return ACTIONS.saveTarget(db, { target: t }, ctx, now);
    },

    /* ----- parents only ----- */
    savePlan: function (db, p, ctx, now) {
      var e = p.entry || {};
      needKid(db, e.kid); needTask(db, e.task); needTime(e.from, 'From'); needTime(e.to, 'To');
      if (!isDate(e.date)) throw err('Pick a date');
      if (e.from === e.to) throw err('From and To are the same');
      var row = e.ref ? byRef(db.plan, e.ref) : null;
      var planBefore = row ? snap(row) : null;
      if (row) {
        var was = row.kid + ' ' + uk(row.date) + ' ' + row.task + ' ' + row.from + '–' + row.to;
        row.kid = e.kid; row.date = e.date; row.from = e.from; row.to = e.to; row.task = e.task; row.note = String(e.note || '').slice(0, 300); upd(db, 'plan', row);
        var now2 = row.kid + ' ' + uk(row.date) + ' ' + row.task + ' ' + row.from + '–' + row.to;
        if (was !== now2) msg(db, now, 'Edit', ctx.name + ' changed Plan ' + row.ref + ': ' + was + ' → ' + now2, [row.ref], ctx.name);
      }
      else row = ins(db, 'plan', { ref: nextRef(db), type: 'Planning', kid: e.kid, date: e.date, from: e.from, to: e.to, task: e.task, by: ctx.name, note: String(e.note || '').slice(0, 300), made: stamp(now) });
      doneFor(db, row.ref).forEach(function (w) { if (w.status !== 'Running') { applyResult(db, w, ctx); upd(db, 'done', w); } });
      var ch = takeSlot(db, 'plan', row, ctx, now, false, planBefore);
      return { ref: row.ref, changed: ch.length };
    },
    delPlan: function (db, p, ctx, now) {
      var row = byRef(db.plan, p.ref);
      if (!row) return {};
      removePlanRow(db, row);
      if (!p.quiet) msg(db, now, 'Delete', ctx.name + ' deleted Plan ' + row.ref + ' (' + row.kid + ', ' + uk(row.date) + ' ' + row.task + ' ' + row.from + '–' + row.to + ')', [row.ref], ctx.name);
      return {};
    },
    genWeek: function (db, p, ctx, now) {
      if (!isDate(p.ws)) throw err('Pick a week');
      var ws = weekStart(p.ws), added = 0;
      db.settings.kids.forEach(function (k) {
        if (p.kid && p.kid !== k.name) return;
        weekDates(ws).forEach(function (d, i) {
          if (p.fromDate && d < p.fromDate) return;
          if (db.plan.some(function (x) { return x.kid === k.name && x.date === d; })) return; // only fill empty days
          db.template.filter(function (t) { return t.kid === k.name && +t.day === i; })
            .sort(function (a, b) { return toMin(a.from) - toMin(b.from); })
            .forEach(function (t) {
              if (!db.tasks.some(function (x) { return x.name === t.task; })) return;
              ins(db, 'plan', { ref: nextRef(db), type: 'Planning', kid: k.name, date: d, from: t.from, to: t.to, task: t.task, by: ctx.name, note: 'From template', made: stamp(now) });
              added++;
            });
        });
      });
      if (added) msg(db, now, 'Plan', ctx.name + ' filled the week of ' + uk(ws) + (p.kid ? ' (' + p.kid + ')' : '') + ' from the template: ' + added + ' entries', [], ctx.name);
      return { added: added };
    },
    clearWeek: function (db, p, ctx, now) {
      var ws = weekStart(p.ws), we = addDays(ws, 6), n = 0;
      db.plan.slice().forEach(function (x) {
        if (x.date < ws || x.date > we || (p.kid && x.kid !== p.kid)) return;
        if (doneFor(db, x.ref).some(function (w) { return w.status !== 'Cancelled' && w.by !== 'Auto'; })) return;
        ACTIONS.delPlan(db, { ref: x.ref, quiet: true }, ctx, now); n++;
      });
      if (n) msg(db, now, 'Plan', ctx.name + ' cleared ' + n + ' plan entries in the week of ' + uk(ws) + (p.kid ? ' (' + p.kid + ')' : ''), [], ctx.name);
      return { removed: n };
    },
    saveTemplate: function (db, p) {
      needKid(db, p.kid);
      var rows = (p.rows || []).map(function (r) {
        needTask(db, r.task); needTime(r.from, 'From'); needTime(r.to, 'To');
        var d = +r.day; if (!(d >= 0 && d <= 6)) throw err('Bad day');
        return { kid: p.kid, day: d, from: r.from, to: r.to, task: r.task };
      });
      db.template.filter(function (t) { return t.kid === p.kid; }).forEach(function (t) { rem(db, 'template', t); });
      rows.forEach(function (r) { ins(db, 'template', r); });
      return { count: rows.length };
    },
    saveTasks: function (db, p) {
      var list = p.tasks || [], seen = {};
      list.forEach(function (t) {
        t.name = String(t.name || '').trim().slice(0, 40);
        if (!t.name) throw err('Every task needs a name');
        if (seen[t.name]) throw err('Two tasks are called ' + t.name);
        seen[t.name] = 1;
        t.nature = normNature(t.nature);
        if (!t.nature) throw err('Pick a nature for ' + t.name);
      });
      // renames flow into plans, workdone and the template
      list.forEach(function (t) {
        if (t.oldName && t.oldName !== t.name) {
          ['plan', 'done', 'template'].forEach(function (tb) { db[tb].forEach(function (r) { if (r.task === t.oldName) { r.task = t.name; upd(db, tb, r); } }); });
          db.targets.forEach(function (r) { if (r.task === t.oldName) { r.task = t.name; upd(db, 'targets', r); } });
        }
      });
      db.tasks.slice().forEach(function (t) { rem(db, 'tasks', t); });
      list.forEach(function (t) { ins(db, 'tasks', { name: t.name, nature: t.nature, emoji: String(t.emoji || '').trim().slice(0, 8) || autoEmoji(t.name, t.nature), link: safeUrl(t.link), active: t.active === 'No' ? 'No' : 'Yes' }); });
      return { count: list.length };
    },
    ticket: function (db, p, ctx, now) {
      needKid(db, p.kid);
      if (isAdult(db, p.kid)) throw err('Grown-ups do not use tickets');
      var n = Math.round(+p.change);
      if (!n) throw err('Enter how many tickets');

/* time label of a calendar event: a coloured pill (the Google calendar colour, or teal when that colour is grey) */
function evPill(x) {
  let c = /^#[0-9a-f]{6}$/i.test(x.color || '') ? x.color : '';
  if (c) { const v = [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)); if (Math.max(...v) - Math.min(...v) < 48) c = ''; }
  const v2 = [1, 3, 5].map((i) => parseInt((c || '#0f766e').slice(i, i + 2), 16)), light = 0.299 * v2[0] + 0.587 * v2[1] + 0.114 * v2[2] > 150;
  return el('span', { class: 'evp', style: `background:${c || '#0f766e'};color:${light ? '#1f2933' : '#fff'}`, text: x.allDay ? t('allDay') : x.start + '–' + x.end });
}
